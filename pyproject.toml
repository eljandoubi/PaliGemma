[project]
name = "paligemma"
version = "0.1.0"
description = "PaliGemma implemented from scratch in PyTorch, for inference."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    ".github",
    "docs",
    "samples",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# `f` is a safetensors file handle (not a dict); `.keys()` cannot be dropped.
"src/utils/model_loader.py" = ["SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true
