[project]
name = "paligemma"
version = "0.1.0"
description = "PaliGemma implemented from scratch in PyTorch, for inference."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fire==0.6.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "tqdm==4.66.4",
    "tokenizers==0.19.1",
    "safetensors==0.4.2",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "sentencepiece==0.2.0",
    "transformers==4.44.0",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
]

[tool.uv]
# Flat, script-style layout (no build backend): only install dependencies.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    ".github",
    "docs",
    "samples",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# `f` is a safetensors file handle (not a dict); `.keys()` cannot be dropped.
"src/utils/model_loader.py" = ["SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true
